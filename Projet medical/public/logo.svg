<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .main-text { font-family: 'Arial', sans-serif; font-size: 38px; font-weight: bold; fill: #60141a; letter-spacing: 5px; }
      .sub-text { font-family: 'Georgia', serif; font-size: 11.5px; fill: #60141a; letter-spacing: 5.5px; }
      .maroon-stroke { stroke: #60141a; fill: none; }
    </style>
  </defs>

  <!-- H O N -->
  <text x="50" y="60" class="main-text">HON</text>

  <!-- The Wheel (second O) -->
  <g transform="translate(178, 46)">
    <circle cx="0" cy="0" r="16" class="maroon-stroke" stroke-width="4.5" />
    <!-- 16 spokes -->
    <g stroke="#60141a" stroke-width="1.2">
      <!-- 0 deg --> <line x1="0" y1="-14" x2="0" y2="-6" />
      <!-- 90 deg --> <line x1="14" y1="0" x2="6" y2="0" />
      <!-- 180 deg --> <line x1="0" y1="14" x2="0" y2="6" />
      <!-- 270 deg --> <line x1="-14" y1="0" x2="-6" y2="0" />
      
      <!-- 45 deg --> <line x1="10" y1="-10" x2="4" y2="-4" />
      <!-- 135 deg --> <line x1="10" y1="10" x2="4" y2="4" />
      <!-- 225 deg --> <line x1="-10" y1="10" x2="-4" y2="4" />
      <!-- 315 deg --> <line x1="-10" y1="-10" x2="-4" y2="-4" />
      
      <!-- 22.5 deg --> <line x1="5.3" y1="-13" x2="2.3" y2="-5.5" />
      <!-- 67.5 deg --> <line x1="13" y1="-5.3" x2="5.5" y2="-2.3" />
      <!-- 112.5 deg --> <line x1="13" y1="5.3" x2="5.5" y2="2.3" />
      <!-- 157.5 deg --> <line x1="5.3" y1="13" x2="2.3" y2="5.5" />
      <!-- 202.5 deg --> <line x1="-5.3" y1="13" x2="-2.3" y2="5.5" />
      <!-- 247.5 deg --> <line x1="-13" y1="5.3" x2="-5.5" y2="2.3" />
      <!-- 292.5 deg --> <line x1="-13" y1="-5.3" x2="-5.5" y2="-2.3" />
      <!-- 337.5 deg --> <line x1="-5.3" y1="-13" x2="-2.3" y2="-5.5" />
    </g>
  </g>

  <!-- R I S -->
  <text x="210" y="60" class="main-text">RIS</text>

  <!-- Horizontal Line -->
  <line x1="50" y1="75" x2="330" y2="75" stroke="#60141a" stroke-width="2.5" />

  <!-- UNITED UNIVERSITIES -->
  <text x="50" y="95" class="sub-text">UNITED UNIVERSITIES</text>
</svg>
